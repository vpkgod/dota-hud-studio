<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUD Studio — редактор худа Dota 2</title>
<meta name="description" content="Собери свой худ для Dota 2: цвета, картинки, размеры и положение каждого блока. Готовый файл мода скачивается прямо из браузера.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preload" href="fonts/unbounded-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles/app.css">
<link rel="stylesheet" href="styles/preview.css">
</head>
<body>
<header class="top">
  <div class="brand" aria-label="HUD Studio"><svg viewBox="0 0 34 34" aria-hidden="true"><path fill="currentColor" d="M34.0 17.0L33.8 17.9L33.3 18.7L32.5 19.4L31.6 20.1L30.8 20.7L30.2 21.3L29.9 22.0L29.9 22.7L30.1 23.7L30.3 24.7L30.5 25.8L30.5 26.8L30.2 27.7L29.6 28.3L28.7 28.7L27.6 28.8L26.5 28.8L25.5 28.7L24.6 28.7L23.9 29.0L23.3 29.5L22.9 30.2L22.4 31.1L21.9 32.1L21.3 33.0L20.5 33.6L19.7 33.8L18.7 33.6L17.8 33.1L17.0 32.4L16.2 31.7L15.5 31.0L14.8 30.6L14.1 30.6L13.3 30.8L12.4 31.2L11.4 31.6L10.4 31.9L9.4 32.0L8.5 31.7L7.8 31.1L7.4 30.2L7.2 29.2L7.0 28.1L6.9 27.1L6.7 26.3L6.3 25.7L5.6 25.3L4.7 25.0L3.7 24.7L2.6 24.3L1.7 23.8L1.1 23.1L0.9 22.2L1.0 21.3L1.5 20.3L2.0 19.4L2.6 18.5L3.0 17.7L3.2 17.0L3.0 16.3L2.6 15.5L2.0 14.6L1.5 13.7L1.0 12.7L0.9 11.8L1.1 10.9L1.7 10.2L2.6 9.7L3.7 9.3L4.7 9.0L5.6 8.7L6.3 8.3L6.7 7.7L6.9 6.9L7.0 5.9L7.2 4.8L7.4 3.8L7.8 2.9L8.5 2.3L9.4 2.0L10.4 2.1L11.4 2.4L12.4 2.8L13.3 3.2L14.1 3.4L14.8 3.4L15.5 3.0L16.2 2.3L17.0 1.6L17.8 0.9L18.7 0.4L19.7 0.2L20.5 0.4L21.3 1.0L21.9 1.9L22.4 2.9L22.9 3.8L23.3 4.5L23.9 5.0L24.6 5.3L25.5 5.3L26.5 5.2L27.6 5.2L28.7 5.3L29.6 5.7L30.2 6.3L30.5 7.2L30.5 8.2L30.3 9.3L30.1 10.3L29.9 11.3L29.9 12.0L30.2 12.7L30.8 13.3L31.6 13.9L32.5 14.6L33.3 15.3L33.8 16.1Z"/><rect class="core" x="9" y="14" width="16" height="6" rx="3"/><rect fill="currentColor" opacity=".55" x="11" y="15.6" width="7" height="2.8" rx="1.4"/></svg>HUD<span>Studio</span></div>
  <label class="project">
    <span>Проект</span>
    <input id="projectName" maxlength="60" spellcheck="false" aria-label="Название проекта">
  </label>
  <span id="saveState" class="save-state" role="status"></span>
  <span class="grow"></span>
  <div class="group">
    <button id="undo" type="button" title="Отменить последнюю правку (Ctrl+Z)"><svg class="ic" aria-hidden="true"><use href="img/icons.svg#i-undo"/></svg>Отменить</button>
    <button id="redo" type="button" title="Вернуть отменённое (Ctrl+Shift+Z)">Вернуть<svg class="ic" aria-hidden="true"><use href="img/icons.svg#i-redo"/></svg></button>
  </div>
  <button id="versionsBtn" type="button" title="Сохранить снимок худа или вернуться к прошлому"><svg class="ic" aria-hidden="true"><use href="img/icons.svg#i-history"/></svg>Версии</button>
  <div class="menu-wrap">
    <button id="fileBtn" type="button" aria-haspopup="true" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="img/icons.svg#i-folder_open"/></svg>Файл<svg class="ic drop" aria-hidden="true"><use href="img/icons.svg#i-arrow_drop_down"/></svg></button>
    <div id="fileMenu" class="popover menu" hidden>
      <button id="exportFile" type="button"><svg class="ic" aria-hidden="true"><use href="img/icons.svg#i-save"/></svg>Сохранить проект в файл</button>
      <button id="importFile" type="button"><svg class="ic" aria-hidden="true"><use href="img/icons.svg#i-upload_file"/></svg>Открыть проект из файла</button>
      <hr>
      <button id="resetAll" type="button" class="danger"><svg class="ic" aria-hidden="true"><use href="img/icons.svg#i-restart_alt"/></svg>Сбросить весь худ</button>
    </div>
    <input id="importInput" type="file" accept=".json,application/json" hidden>
  </div>
  <button id="themeBtn" type="button" class="icon" title="Светлая или тёмная тема сайта" aria-label="Сменить тему сайта"><svg class="ic to-dark" aria-hidden="true"><use href="img/icons.svg#i-dark_mode"/></svg><svg class="ic to-light" aria-hidden="true"><use href="img/icons.svg#i-light_mode"/></svg></button>
  <a class="tg" href="https://t.me/vpkdota" target="_blank" rel="noopener" title="Телеграм-канал автора: новости и обновления" aria-label="Телеграм-канал автора"><svg class="ic" aria-hidden="true"><use href="img/icons.svg#i-telegram"/></svg></a>
  <button id="downloadBtn" type="button" class="primary"><svg class="ic" aria-hidden="true"><use href="img/icons.svg#i-download"/></svg>Скачать худ <b id="downloadCount" class="badge" hidden></b></button>
</header>

<main class="work">
  <nav id="nav" class="nav" aria-label="Разделы худа"></nav>
  <section id="panel" class="panel" aria-label="Настройки раздела"></section>
  <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" title="Потяни, чтобы изменить ширину панели. Двойной клик вернёт обычную."></div>
  <section class="view" aria-label="Превью худа">
    <div class="view-bar">
      <div class="seg" role="group" aria-label="Что показать в превью">
        <button id="scene-game" type="button">В бою</button>
        <button id="scene-shop" type="button">Магазин</button>
        <button id="scene-tree" type="button">Таланты</button>
        <button id="scene-board" type="button">Таблица (Tab)</button>
      </div>
      <div id="treeModes" class="seg" role="group" aria-label="Как открыта ветка талантов" hidden>
        <button id="treeTip" type="button" title="Ветка, которая появляется при наведении мыши на кнопку талантов">Наведение</button>
        <button id="treePin" type="button" aria-pressed="true" title="Ветка, открытая кликом по кнопке талантов">Клик</button>
      </div>
      <span class="grow"></span>
      <button id="compare" type="button" aria-pressed="false" title="Пока кнопка зажата, виден обычный худ Dota"><svg class="ic" aria-hidden="true"><use href="img/icons.svg#i-visibility"/></svg>Зажми: как в игре</button>
      <div class="seg zoom" role="group" aria-label="Масштаб превью">
        <button id="zoomOut" type="button" title="Отдалить" aria-label="Отдалить"><svg class="ic" aria-hidden="true"><use href="img/icons.svg#i-remove"/></svg></button>
        <span id="zoomLabel" class="zoom-label" aria-live="off">100%</span>
        <button id="zoomIn" type="button" title="Приблизить" aria-label="Приблизить"><svg class="ic" aria-hidden="true"><use href="img/icons.svg#i-add"/></svg></button>
      </div>
      <button id="zoomFit" type="button" title="Показать весь экран целиком"><svg class="ic" aria-hidden="true"><use href="img/icons.svg#i-fit_screen"/></svg>Весь экран</button>
      <div class="menu-wrap">
        <button id="viewBtn" type="button" aria-haspopup="true" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="img/icons.svg#i-tune"/></svg>Вид<svg class="ic drop" aria-hidden="true"><use href="img/icons.svg#i-arrow_drop_down"/></svg></button>
        <div id="viewMenu" class="popover view-menu" hidden>
          <label class="line"><span>Здоровье</span><input id="pvHp" type="range" min="0" max="100" value="76"></label>
          <label class="line"><span>Мана</span><input id="pvMp" type="range" min="0" max="100" value="58"></label>
          <label class="line"><span>Экран</span>
            <select id="pvRatio">
              <option value="1.7778">Обычный (16:9)</option>
              <option value="1.6">Чуть выше (16:10)</option>
              <option value="2.3704">Широкий (21:9)</option>
            </select>
          </label>
          <label class="line check"><input id="pvEnemy" type="checkbox"><span>Показать полоску врага</span></label>
          <label class="line check"><input id="pvAlt" type="checkbox"><span>Зажат Alt: полоски героев сверху</span></label>
          <label class="line check"><input id="pvAghs" type="checkbox"><span>У героя есть аганим и осколок</span></label>
          <button id="pvBg" type="button"><svg class="ic" aria-hidden="true"><use href="img/icons.svg#i-add_photo_alternate"/></svg>Свой скриншот на фон</button>
          <input id="pvBgFile" type="file" accept="image/*" hidden>
        </div>
      </div>
    </div>
    <div id="stageWrap" class="stage-wrap">
      <div id="stage" class="stage"></div>
      <div id="stageTip" class="stage-tip" hidden></div>
    </div>
    <p class="view-foot">Нажми на часть худа, чтобы открыть её настройку. Блоки можно перетаскивать мышью, колесо меняет масштаб. Превью приблизительное: итог смотри в игре.</p>
  </section>
</main>

<dialog id="downloadDialog" class="dialog" aria-label="Скачать худ"></dialog>
<dialog id="versionsDialog" class="dialog" aria-label="Версии"></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<noscript><p class="noscript">Редактору нужен JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
